    JP-40 [M3-T2] Hotbar UI — 5 slots at the bottom centre, selected slot lit
    JP-41 [M3-T3] Hotbar selection — keys 1-5, mouse-wheel cycling with wrap
    JP-42 [M3-T4] Per-block sounds — distinct stone, wood, sand profiles synthesised in Web Audio

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jaxx's BlockVenture</title>
  <style>
    /* Make the canvas fill the whole browser window with no scrollbars. */
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #87CEEB; }
    canvas { display: block; }

    /* "Click to play" overlay — shown when the pointer isn't locked. */
    #overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay small {
      display: block;
      margin-top: 12px;
      font-size: 16px;
      font-weight: 400;
      opacity: 0.85;
    }

    /* Hotbar at the bottom of the screen — built dynamically in JS from
       the BLOCKS registry so adding a block also adds a slot. */
    #hotbar {
      position: fixed;
      left: 50%; bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: none;     /* never intercept world clicks */
      user-select: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .slot {
      width: 56px; height: 70px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      box-sizing: border-box;
      transition: border-color 120ms, transform 120ms, box-shadow 120ms;
    }
    .slot.selected {
      border-color: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
      transform: translateY(-3px);
    }
    .slot .swatch {
      width: 36px; height: 36px;
      border-radius: 4px;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.18), inset 0 4px 0 rgba(255,255,255,0.12);
    }
    .slot .label {
      margin-top: 4px;
      font-size: 11px;
      color: white;
      letter-spacing: 0.3px;
    }
    .slot .key {
      position: absolute;
      transform: translate(20px, -4px);
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.55);
      border-radius: 3px;
      padding: 1px 4px;
    }

    /* Tiny crosshair so the player knows where they're aiming. */
    #crosshair {
      position: fixed;
      left: 50%; top: 50%;
      width: 14px; height: 14px;
      margin-left: -7px; margin-top: -7px;
      pointer-events: none;
      opacity: 0.9;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: white;
      box-shadow: 0 0 2px rgba(0,0,0,0.6);
    }
    #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
    #crosshair::after  { left: 0; top: 6px; width: 14px; height: 2px; }
  </style>

  <!-- Importmap: tells the browser where to find the "three" module.
       Pinned to version 0.160.0 so future Three.js updates can't break our game. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Click-to-play overlay. Hidden when pointer is locked. -->
  <div id="overlay">
    Click to play
    <small>Move: W A S D &nbsp;·&nbsp; Look: mouse &nbsp;·&nbsp; Esc to release</small>
  </div>

  <!-- Crosshair in the centre of the screen. -->
  <div id="crosshair"></div>

  <!-- Hotbar — populated in JS from the BLOCKS registry. -->
  <div id="hotbar"></div>

  <!-- Main game script. type="module" is required for importmap to work. -->
  <script type="module">
    import * as THREE from 'three';

    console.log('Three.js loaded', THREE.REVISION);

    // ---------------------------------------------------------------------
    // Scene, camera, renderer
    // ---------------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // sky blue

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const EYE_HEIGHT = 2.2;
    camera.position.set(0, EYE_HEIGHT, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------------------------------------------------------------------
    // Lights
    // ---------------------------------------------------------------------
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(20, 30, 10);
    scene.add(sun);

    // ---------------------------------------------------------------------
    // Block registry — every type of block in the world is defined here.
    // ---------------------------------------------------------------------
    // Adding a new block type is a single line in this object. Each entry
    // is keyed by a numeric id so it serialises cleanly to disk in M4.
    //   name          shown in the UI (hotbar)
    //   color         flat colour for the cube (textures come in M5)
    //   breakSound    name of the procedural sound to play on break
    //   placeSound    name of the procedural sound to play on place
    const BLOCKS = {
      1: { name: 'Grass', color: 0x4CAF50, breakSound: 'crack',      placeSound: 'thud'      },
      2: { name: 'Dirt',  color: 0x8D6E63, breakSound: 'crack',      placeSound: 'thud'      },
      3: { name: 'Stone', color: 0x9E9E9E, breakSound: 'stoneCrack', placeSound: 'stoneThud' },
      4: { name: 'Wood',  color: 0x8B5A2B, breakSound: 'woodCrack',  placeSound: 'woodThud'  },
      5: { name: 'Sand',  color: 0xF4E1A4, breakSound: 'sandCrack',  placeSound: 'sandThud'  },
    };
    // Convenience constants so code reads "GRASS" instead of "1".
    const GRASS = 1, DIRT = 2, STONE = 3, WOOD = 4, SAND = 5;

    // One MeshStandardMaterial per block type — cached so 400 grass blocks
    // share a single material object (cheaper, less GC pressure).
    const blockMaterials = new Map();
    function materialFor(blockId) {
      let mat = blockMaterials.get(blockId);
      if (!mat) {
        mat = new THREE.MeshStandardMaterial({ color: BLOCKS[blockId].color });
        blockMaterials.set(blockId, mat);
      }
      return mat;
    }

    // The block type the player is currently holding. JP-41 will let the
    // player change it with the number keys / mouse wheel; for now it's
    // hard-coded to Grass.
    let selectedBlockId = GRASS;

    // ---------------------------------------------------------------------
    // Hotbar — one slot per entry in BLOCKS, built from the registry.
    // ---------------------------------------------------------------------
    // Slots are populated once at startup. The "selected" highlight is
    // toggled whenever `selectedBlockId` changes via setSelectedBlock().
    const hotbarEl = document.getElementById('hotbar');
    const slotEls = new Map(); // blockId -> .slot DOM node

    function hexToCss(hex) { return '#' + hex.toString(16).padStart(6, '0'); }

    for (const id of Object.keys(BLOCKS)) {
      const blockId = Number(id);
      const def = BLOCKS[blockId];
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.innerHTML = `
        <span class="key">${blockId}</span>
        <div class="swatch" style="background:${hexToCss(def.color)}"></div>
        <div class="label">${def.name}</div>
      `;
      hotbarEl.appendChild(slot);
      slotEls.set(blockId, slot);
    }

    function setSelectedBlock(blockId) {
      if (!BLOCKS[blockId]) return;
      selectedBlockId = blockId;
      for (const [id, el] of slotEls) {
        el.classList.toggle('selected', id === blockId);
      }
    }
    setSelectedBlock(GRASS); // initial highlight

    // ---------------------------------------------------------------------
    // World — 20x20 flat grass field, stored in a Group + a coord Map.
    // ---------------------------------------------------------------------
    // The Group holds every block mesh. Putting blocks in a group lets us
    // raycast against only the blocks (instead of every object in the scene).
    // The Map lets us instantly look up "is there a block at (x,y,z)?" by
    // its integer grid coordinate — needed for placing and breaking.
    const blocksGroup = new THREE.Group();
    scene.add(blocksGroup);
    const blockMap = new Map();
    const coordKey = (x, y, z) => `${x},${y},${z}`;

    const blockGeo = new THREE.BoxGeometry(1, 1, 1);
    const WORLD_SIZE = 20;
    const offset = (WORLD_SIZE - 1) / 2;

    function addBlock(gx, gy, gz, blockId) {
      const block = new THREE.Mesh(blockGeo, materialFor(blockId));
      block.position.set(gx, gy, gz);
      // Stash the grid coord and block id on the mesh so handlers (raycast
      // hit, break, place, future save-game) can read them without lookups.
      block.userData.coord = { x: gx, y: gy, z: gz };
      block.userData.blockId = blockId;
      blocksGroup.add(block);
      blockMap.set(coordKey(gx, gy, gz), block);
      return block;
    }

    for (let x = 0; x < WORLD_SIZE; x++) {
      for (let z = 0; z < WORLD_SIZE; z++) {
        addBlock(x - offset, 0, z - offset, GRASS);
      }
    }

    // ---------------------------------------------------------------------
    // Audio — procedural break ("crack") and place ("thud") sounds
    // ---------------------------------------------------------------------
    // Generated with the Web Audio API instead of loading external files,
    // so there are no broken-URL risks and we control the volume exactly.
    // Master gain is intentionally low — kid ears, not arcade volume.
    let audioCtx = null;
    let masterGain = null;

    // Browsers block AudioContext until a user gesture. We create it on
    // the first interaction, then reuse for every sound after that.
    function ensureAudio() {
      if (audioCtx) return audioCtx;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.35; // moderate, kid-friendly
      masterGain.connect(audioCtx.destination);
      return audioCtx;
    }

    // Helper: short oscillator hit with pitch sweep + amplitude envelope.
    // Used as the building block for "thud"-style place sounds.
    function thudHit({ type='sine', from, to, peak=0.6, length=0.18, sweep=0.08 }) {
      const ctx = ensureAudio();
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t0);
      osc.frequency.exponentialRampToValueAtTime(to, t0 + sweep);
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
      osc.connect(env).connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + length + 0.02);
    }

    // Helper: short filtered-noise burst. Used as the building block for
    // "crack"-style break sounds.
    function noiseBurst({ filterType='bandpass', freq=1800, Q=0.9, peak=0.5, length=0.12 }) {
      const ctx = ensureAudio();
      const t0 = ctx.currentTime;
      const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * length)), ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = freq;
      filter.Q.value = Q;
      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
      src.connect(filter).connect(env).connect(masterGain);
      src.start(t0);
      src.stop(t0 + length + 0.01);
    }

    // Named sound recipes — each block type's break/place name in BLOCKS
    // refers to one of these.
    const SOUND_RECIPES = {
      // Default earthy sounds (Grass, Dirt).
      thud:       () => thudHit({ from: 140, to: 70 }),
      crack:      () => noiseBurst({ freq: 1800, Q: 0.9 }),
      // Stone — sharp, bright, slightly metallic.
      stoneThud:  () => thudHit({ type: 'square', from: 220, to: 110, peak: 0.45, length: 0.12, sweep: 0.05 }),
      stoneCrack: () => noiseBurst({ freq: 3200, Q: 1.6, length: 0.09 }),
      // Wood — hollow, lower mid range, slightly longer ring.
      woodThud:   () => thudHit({ from: 110, to: 55, length: 0.28, sweep: 0.12, peak: 0.55 }),
      woodCrack:  () => noiseBurst({ freq: 800,  Q: 2.0, length: 0.13 }),
      // Sand — soft whoosh, no sharp transient.
      sandThud:   () => noiseBurst({ filterType: 'lowpass',  freq: 600,  Q: 0.6, peak: 0.35, length: 0.16 }),
      sandCrack:  () => noiseBurst({ filterType: 'highpass', freq: 4000, Q: 0.6, peak: 0.30, length: 0.10 }),
    };

    function playSound(name) {
      const recipe = SOUND_RECIPES[name];
      if (recipe) recipe();
    }

    // Pre-warm the audio context after the first user click so the very
    // first block sound has no startup delay. (Browsers require a gesture
    // to create the context — see ensureAudio.)
    window.addEventListener('mousedown', () => ensureAudio(), { once: true });

    // ---------------------------------------------------------------------
    // Targeting — raycast from camera each frame, highlight the hit block
    // ---------------------------------------------------------------------
    // Reach: how far the player can interact. ~5 blocks is the classic
    // Minecraft feel and keeps the raycast cheap.
    const REACH = 5;

    const raycaster = new THREE.Raycaster();
    raycaster.far = REACH;
    // Ray starts at the centre of the screen (camera direction).
    const screenCentre = new THREE.Vector2(0, 0);

    // Highlight = a wireframe outline of a 1x1x1 cube, slightly inflated so
    // its lines sit just outside the block surface (no z-fighting). It's
    // hidden when the player isn't looking at any block.
    const highlightEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.02, 1.02, 1.02));
    const highlightMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
    const highlight = new THREE.LineSegments(highlightEdges, highlightMat);
    highlight.visible = false;
    scene.add(highlight);

    // The currently-targeted block, plus the face normal of the hit so we
    // know which side the player is looking at (used by place-block).
    let targetedBlock = null;
    const targetedNormal = new THREE.Vector3();

    function updateTarget() {
      raycaster.setFromCamera(screenCentre, camera);
      // Only check the blocks group — never the highlight mesh.
      const hits = raycaster.intersectObjects(blocksGroup.children, false);
      if (hits.length > 0) {
        targetedBlock = hits[0].object;
        // face.normal is in local space; blocks aren't rotated so it
        // matches world space directly. Round to integers (-1, 0, or 1)
        // to avoid floating-point noise from confusing neighbour math.
        targetedNormal.copy(hits[0].face.normal).round();
        highlight.position.copy(targetedBlock.position);
        highlight.visible = true;
      } else {
        targetedBlock = null;
        highlight.visible = false;
      }
    }

    // Remove a block from the world cleanly: detach the mesh and drop it
    // from the lookup map. We deliberately do NOT dispose the geometry or
    // the material — both are shared (one geometry for every block, one
    // material per block type) so disposing would break the other blocks
    // still using them.
    function removeBlock(block) {
      const { x, y, z } = block.userData.coord;
      blocksGroup.remove(block);
      blockMap.delete(coordKey(x, y, z));
    }

    // Refuse to place a block that would overlap the player's body.
    // Player is approximated as an axis-aligned box: ~0.6 wide, 1.7 tall,
    // with feet at (camera.y - 1.7) and head at camera.y.
    const PLAYER_HALF = 0.3;
    function blockOverlapsPlayer(bx, by, bz) {
      const p = camera.position;
      const feet = p.y - 1.7;
      const head = p.y;
      return Math.abs(bx - p.x) < 0.5 + PLAYER_HALF &&
             Math.abs(bz - p.z) < 0.5 + PLAYER_HALF &&
             (by + 0.5) > feet &&
             (by - 0.5) < head;
    }

    // Add the currently-selected block type on the face of the targeted block.
    function placeBlock() {
      if (!targetedBlock) return;
      const { x, y, z } = targetedBlock.userData.coord;
      const nx = x + targetedNormal.x;
      const ny = y + targetedNormal.y;
      const nz = z + targetedNormal.z;
      // Don't place a duplicate (shouldn't happen, but cheap to guard).
      if (blockMap.has(coordKey(nx, ny, nz))) return;
      // Don't place a block on top of the player.
      if (blockOverlapsPlayer(nx, ny, nz)) return;
      addBlock(nx, ny, nz, selectedBlockId);
    }

    // ---------------------------------------------------------------------
    // Mouse-look (pointer lock) — yaw/pitch driven by mouse movement
    // ---------------------------------------------------------------------
    let yaw = 0;
    let pitch = 0;
    const PITCH_LIMIT = Math.PI / 2 - 0.01;
    const LOOK_SENSITIVITY = 0.002;

    const overlay = document.getElementById('overlay');
    const canvas = renderer.domElement;

    overlay.addEventListener('click', () => canvas.requestPointerLock());

    // Mouse-down on the canvas:
    //   • If pointer isn't locked, lock it (left click only).
    //   • If pointer IS locked, left click breaks, right click places.
    canvas.addEventListener('mousedown', (e) => {
      if (document.pointerLockElement !== canvas) {
        if (e.button === 0) canvas.requestPointerLock();
        return;
      }
      if (e.button === 0 && targetedBlock) {
        // Hide the highlight immediately — it's about to be re-resolved on
        // the next frame, but this stops a flicker on the now-deleted block.
        highlight.visible = false;
        const brokenId = targetedBlock.userData.blockId;
        removeBlock(targetedBlock);
        targetedBlock = null;
        playSound(BLOCKS[brokenId].breakSound);
      } else if (e.button === 2) {
        const before = blockMap.size;
        placeBlock();
        // Only play the place sound if a block was actually placed (not
        // blocked by the player's body or by hitting empty air).
        if (blockMap.size > before) playSound(BLOCKS[selectedBlockId].placeSound);
      }
    });

    // Suppress the right-click context menu so placing blocks isn't
    // interrupted by the browser's native menu popping up.
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('pointerlockchange', () => {
      const locked = document.pointerLockElement === canvas;
      overlay.classList.toggle('hidden', locked);
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== canvas) return;
      yaw   -= e.movementX * LOOK_SENSITIVITY;
      pitch -= e.movementY * LOOK_SENSITIVITY;
      if (pitch >  PITCH_LIMIT) pitch =  PITCH_LIMIT;
      if (pitch < -PITCH_LIMIT) pitch = -PITCH_LIMIT;
    });

    // ---------------------------------------------------------------------
    // Player input — track which keys are currently held
    // ---------------------------------------------------------------------
    const keys = { w: false, a: false, s: false, d: false };

    // Ordered list of block IDs in the same order as the hotbar slots.
    // Used by the mouse wheel to cycle previous / next.
    const blockOrder = Object.keys(BLOCKS).map(Number);

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      // Number keys 1-9 select the matching hotbar slot if it exists.
      if (e.key >= '1' && e.key <= '9') {
        const id = Number(e.key);
        if (BLOCKS[id]) setSelectedBlock(id);
      }
    });

    // Mouse wheel cycles through the hotbar (only when locked, so the
    // overlay isn't accidentally scrolled when the menu is showing).
    window.addEventListener('wheel', (e) => {
      if (document.pointerLockElement !== canvas) return;
      const idx = blockOrder.indexOf(selectedBlockId);
      const dir = e.deltaY > 0 ? 1 : -1;
      const next = (idx + dir + blockOrder.length) % blockOrder.length;
      setSelectedBlock(blockOrder[next]);
    }, { passive: true });
    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });
    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
    });

    // ---------------------------------------------------------------------
    // Resize handling
    // ---------------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------------------------------------------------------------------
    // Render loop — apply look angles, move the player, update the target
    // ---------------------------------------------------------------------
    const MOVE_SPEED = 4;

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const move = new THREE.Vector3();
    const UP = new THREE.Vector3(0, 1, 0);
    const lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1);

      lookEuler.set(pitch, yaw, 0);
      camera.quaternion.setFromEuler(lookEuler);

      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      right.crossVectors(forward, UP).normalize();

      move.set(0, 0, 0);
      if (keys.w) move.add(forward);
      if (keys.s) move.sub(forward);
      if (keys.d) move.add(right);
      if (keys.a) move.sub(right);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(MOVE_SPEED * dt);
        camera.position.add(move);
      }

      if (camera.position.y < EYE_HEIGHT) camera.position.y = EYE_HEIGHT;

      updateTarget();

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
